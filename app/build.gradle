plugins { id 'com.android.application' }
android {
    namespace 'com.chk.agentbrowser'
    compileSdk 35
    defaultConfig {
        applicationId 'com.chk.agentbrowser'
        minSdk 23
        targetSdk 34
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode = Integer.parseInt(System.getenv('RELEASE_CODE') ?: '1')
        versionName = (System.getenv('RELEASE_VERSION') ?: '1.0.0')
    }
    signingConfigs {
        release {
            if (System.getenv('CHK_KEYSTORE_FILE')) {
                storeFile file(System.getenv('CHK_KEYSTORE_FILE'))
                storePassword System.getenv('CHK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CHK_KEY_ALIAS')
                keyPassword System.getenv('CHK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; if (System.getenv('CHK_KEYSTORE_FILE')) signingConfig signingConfigs.release }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
}

dependencies {
    implementation "androidx.media3:media3-transformer:1.9.4"
    implementation "androidx.media3:media3-effect:1.9.4"
    implementation "androidx.media3:media3-common:1.9.4"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}
