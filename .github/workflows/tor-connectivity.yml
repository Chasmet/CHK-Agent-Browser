name: Tor isolated engine verification
on:
  push:
    branches: [feature/local3-studio-tor-20261029]
    paths: ['validation/probe_tor_bundle.py', '.github/workflows/tor-connectivity.yml', 'app/**Tor**', 'app/build.gradle', 'settings.gradle']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 validation/probe_tor_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: tor-bundle-${{ github.sha }}
          path: tor-bundle-proof/
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK and isolated engine compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug assembleDebugAndroidTest :tor-wrapper:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tor-build-${{ github.sha }}
          path: |
            app/build/reports/
            tor-wrapper/build/reports/
            app/build/outputs/apk/debug/*.apk
          retention-days: 3
