name: Tor isolated engine verification
on:
  push:
    branches: [feature/local3-studio-tor-20261029]
    paths: ['validation/probe_tor_bundle.py', '.github/workflows/tor-connectivity.yml', 'app/**Tor**', 'app/build.gradle', 'settings.gradle', 'tor-wrapper/**', 'validation/tor_android_checks.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 validation/probe_tor_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: tor-bundle-${{ github.sha }}
          path: tor-bundle-proof/
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK and isolated engine compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug :app:assembleDebugAndroidTest :tor-wrapper:lintDebug
      - name: Explain Android validation failures
        if: failure()
        run: |
          python3 - <<'PYERR'
          from pathlib import Path
          for root in ('app', 'tor-wrapper'):
              for report in Path(root+'/build/intermediates').rglob('lint-results-debug.txt'):
                  lines=report.read_text().splitlines()
                  for n,line in enumerate(lines):
                      if 'Error:' in line: print('\n'.join(lines[n:n+5]))
          PYERR
      - name: KVM
        run: sudo chmod 666 /dev/kvm
      - name: Real Tor circuit and onion on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash validation/tor_android_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tor-build-${{ github.sha }}
          path: |
            app/build/tor-proof/
            app/build/reports/
            tor-wrapper/build/reports/
            app/build/outputs/apk/debug/*.apk
          retention-days: 3
