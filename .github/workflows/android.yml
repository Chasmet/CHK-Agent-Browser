name: CHK Agent Browser - APK Android et Releases
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/offline-studio-director, agent/persistent-autopilot-preview, agent/connection-resilience, agent/browser-stability-20261009, agent/mobile-workspace-20261009, agent/mobile-studio-20261009, agent/general-audit-20261010, feature/cut-studio-20261010, 'feature/cut-*', 'feature/files-*', 'feature/share-*', 'feature/browser-*', 'feature/session-*', 'feature/publication-*', 'feature/agent-desktop-*', 'feature/local3-*', 'feature/local-ai-*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  actions: read
concurrency:
  group: chk-agent-browser-${{ github.ref_name == 'main' && github.sha || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Télécharger les sources
        uses: actions/checkout@v4
      - name: Préparer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 36 (runner Ubuntu préinstallé)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.11.1
      - name: Compiler le moteur IA local ARM64 (llama.cpp, code source figé)
        run: |
          bash scripts/build_local_ai_android.sh
          test -s app/src/main/jniLibs/arm64-v8a/libchk_local_ai.so
      - name: Vérifier les scripts navigateur et la reconnexion
        run: bash validation/check.sh
      - name: Compiler APK debug
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Vérifier les bibliothèques FFmpeg dans l'APK debug
        run: python3 validation/check_ffmpeg_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Afficher les erreurs Android si la vérification échoue
        if: failure()
        run: |
          if test -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; then
            grep -A 5 'Error:' app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          fi
      - name: Autoriser KVM pour les tests Android
        run: sudo chmod 666 /dev/kvm
      - uses: actions/cache@v4
        with:
          path: .ci-test-models
          key: vosk-test-en-us-0.15-v1
      - name: Prepare public speech test model on CI host
        run: python3 validation/prepare_studio_test_model.py
      - name: Préparer la capture DNS de validation Tor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tcpdump
      - name: Tester navigateur, Fichiers, Notes et véritable export vidéo sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.chk.agentbrowser.AgentKeyboardIntegrationTest,com.chk.agentbrowser.StudioLayersIntegrationTest,com.chk.agentbrowser.PrivateWebCaptureTest,com.chk.agentbrowser.Local3RecoveryTest,com.chk.agentbrowser.Local2BrowserAutomationTest,com.chk.agentbrowser.Local2SessionIntegrationTest,com.chk.agentbrowser.StudioSubtitlesTest,com.chk.agentbrowser.VideoEditorIntegrationTest#timedSubtitlesAppearAndDisappearAcrossRealExportClipBoundary
            bash validation/install_studio_test_model.sh
            # Full regression suite is deterministic; real Tor DNS/onion validation lives in tor-connectivity.yml.
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            adb pull /data/local/tmp/chk-autonomy-fixtures app/build/autonomy-fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les documents créés par Android avec des lecteurs indépendants
        run: |
          python -m pip install python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pypdf==6.10.0
          python validation/check_generated_documents.py app/build/autonomy-fixtures
      - name: Conserver les résultats des tests Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-android-tests-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/tor-proof/
          retention-days: 2
          if-no-files-found: ignore
      - name: Conserver seulement 1 jour dans Actions
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Agent-Browser-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error
      - name: Exiger la validation réseau Tor réelle du commit avant la signature
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Tor job starts on the same main commit, in parallel with Android tests.
          # Do not publish until the same SHA is validated, never accept a previous release proof.
          for ATTEMPT in $(seq 1 60); do
            TOR_VALIDATED=$(gh run list --workflow tor-connectivity.yml --commit "$GITHUB_SHA" --limit 30 --json conclusion --jq '[.[] | select(.conclusion=="success")] | length')
            if test "${TOR_VALIDATED:-0}" -ge 1; then
              echo "Tor validé pour $GITHUB_SHA"
              exit 0
            fi
            TOR_FAILED=$(gh run list --workflow tor-connectivity.yml --commit "$GITHUB_SHA" --limit 30 --json conclusion --jq '[.[] | select(.conclusion=="failure" or .conclusion=="cancelled")] | length')
            if test "${TOR_FAILED:-0}" -ge 1; then
              echo "Test Tor refusé sur ce commit ; aucune Release."
              exit 1
            fi
            sleep 20
          done
          echo "Validation Tor non confirmée sur ce commit ; aucune Release."
          exit 1
      - name: Vérifier que le commit à publier est toujours en tête de main
        if: github.ref == 'refs/heads/main'
        run: |
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA"
      - name: Vérifier provenance et notices FFmpeg avant diffusion
        if: github.ref == 'refs/heads/main'
        run: |
          python3 validation/check_ffmpeg_distribution.py
          AAR=$(find "$HOME/.gradle/caches/modules-2/files-2.1/dev.ffmpegkit-maintained/ffmpeg-kit-full/8.1.9" -name 'ffmpeg-kit-full-8.1.9.aar' -type f)
          test -f "$AAR"
          ./gradlew --no-daemon :app:assembleDebug -PchkFfmpegAar="$AAR"
          python3 validation/check_ffmpeg_apk.py app/build/outputs/apk/debug/app-debug.apk
          zip -r FFmpeg-NOTICES.zip ffmpeg-release-notices
          test -s FFmpeg-NOTICES.zip
      - name: Charger signature persistante via GitHub OIDC et Render existant
        if: github.ref == 'refs/heads/main'
        run: python3 signing/prepare_ci.py
      - name: Compiler APK Release signé
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
          RELEASE_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Vérifier la signature Release
        if: github.ref == 'refs/heads/main'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          python3 validation/check_ffmpeg_apk.py "$APK"
          python3 - "$APK" <<'PYAPK'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = apk.namelist()
              removed = ("libqemu", "libpodroid", "libslirp", "assets/android-guest/")
              unexpected = [name for name in names if any(part in name for part in removed)]
              if unexpected:
                  raise SystemExit(f"Composants de l’ancien émulateur présents : {unexpected}")
          print("APK vérifiée sans moteur ni image de l’émulateur")
          PYAPK
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK"
          curl --fail --silent --show-error --location --retry 2 -o previous-release.apk https://github.com/Chasmet/CHK-Agent-Browser/releases/download/v1.0.739/CHK-Agent-Browser-1.0.739.apk
          cert() { "$SIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'; }
          PREVIOUS_CERT=$(cert previous-release.apk)
          test -n "$PREVIOUS_CERT"
          test "$PREVIOUS_CERT" = "$(cert "$APK")"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          previous=$("$AAPT" dump badging previous-release.apk | sed -n "s/^package: name='com.chk.agentbrowser' versionCode='\([0-9]*\)'.*/\1/p")
          current=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='com.chk.agentbrowser' versionCode='\([0-9]*\)'.*/\1/p")
          test -n "$previous" && test -n "$current" && test "$current" -gt "$previous"
          rm previous-release.apk
          echo "Mise à jour vérifiée pour com.chk.agentbrowser, versionCode $previous → $current, même certificat"
      - name: Renommer l'APK Release
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: cp app/build/outputs/apk/release/app-release.apk "CHK-Agent-Browser-${RELEASE_VERSION}.apk"
      - name: Sauvegarder Release dans Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Agent-Browser-release-${{ github.run_number }}
          path: CHK-Agent-Browser-*.apk
          retention-days: 2
      - name: Publier la nouvelle Release GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: |
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA"
          ASSETS=("CHK-Agent-Browser-${RELEASE_VERSION}.apk" FFmpeg-NOTICES.zip)
          sha256sum "${ASSETS[@]}" > SHA256SUMS.txt
          gh release create "v${RELEASE_VERSION}" "${ASSETS[@]}" \
            --title "CHK Agent Browser ${RELEASE_VERSION}" \
            --notes-file docs/RELEASE_NOTES.md
          gh release upload "v${RELEASE_VERSION}" SHA256SUMS.txt

