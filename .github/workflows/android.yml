name: CHK Agent Browser - APK Android et Releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Télécharger les sources
        uses: actions/checkout@v4
      - name: Préparer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 34 (runner Ubuntu préinstallé)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Installer Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.6
      - name: Compiler APK debug
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Conserver seulement 3 jours dans Actions
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Agent-Browser-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error
      # Configurer une seule fois ces secrets dans GitHub Actions :
      # CHK_KEYSTORE_BASE64, CHK_KEYSTORE_PASSWORD, CHK_KEY_ALIAS, CHK_KEY_PASSWORD
      # Ils restent sur GitHub Actions et ne sont jamais embarqués dans l'APK.
      - name: Charger la clé de signature persistante
        env:
          SIGNING_BASE64: ${{ secrets.CHK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CHK_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.CHK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHK_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$SIGNING_BASE64" | base64 --decode > "$RUNNER_TEMP/chk-release.jks"
            echo "CHK_KEYSTORE_FILE=$RUNNER_TEMP/chk-release.jks" >> "$GITHUB_ENV"
            echo "CHK_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "CHK_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "CHK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "APK Release impossible avant la configuration de signature stable."
          fi
      - name: Compiler APK Release signé
        if: env.HAS_SIGNING == 'true'
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
          RELEASE_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Vérifier la signature Release
        if: env.HAS_SIGNING == 'true'
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Renommer l'APK Release
        if: env.HAS_SIGNING == 'true'
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: cp app/build/outputs/apk/release/app-release.apk "CHK-Agent-Browser-${RELEASE_VERSION}.apk"
      - name: Sauvegarder Release dans Artifacts
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Agent-Browser-release-${{ github.run_number }}
          path: CHK-Agent-Browser-*.apk
          retention-days: 7
      - name: Publier la nouvelle Release GitHub
        if: env.HAS_SIGNING == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: |
          gh release create "v${RELEASE_VERSION}" "CHK-Agent-Browser-${RELEASE_VERSION}.apk" \
            --title "CHK Agent Browser ${RELEASE_VERSION}" \
            --notes "APK signé. Mises à jour : Réglages > Vérifier les mises à jour."
