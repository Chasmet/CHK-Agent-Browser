name: CHK Agent Browser - APK Android et Releases
on:
  push:
    branches: [main, agent/persistent-autopilot-preview, agent/connection-resilience, agent/browser-stability-20261009, agent/mobile-workspace-20261009, agent/mobile-studio-20261009]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: chk-agent-browser-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Télécharger les sources
        uses: actions/checkout@v4
      - name: Préparer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 35 (runner Ubuntu préinstallé)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7
      - name: Vérifier les scripts navigateur et la reconnexion
        run: bash validation/check.sh
      - name: Compiler APK debug
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Autoriser KVM pour les tests Android
        run: sudo chmod 666 /dev/kvm
      - name: Tester navigateur, Fichiers, Notes et véritable export vidéo sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Conserver les résultats des tests Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-android-tests-${{ github.run_number }}
          path: app/build/reports/androidTests/
          retention-days: 2
          if-no-files-found: ignore
      - name: Conserver seulement 1 jour dans Actions
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Agent-Browser-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error
      - name: Charger signature persistante via GitHub OIDC et Render existant
        if: github.ref == 'refs/heads/main'
        run: python3 signing/prepare_ci.py
      - name: Compiler APK Release signé
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
          RELEASE_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Vérifier la signature Release
        if: github.ref == 'refs/heads/main'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Renommer l'APK Release
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: cp app/build/outputs/apk/release/app-release.apk "CHK-Agent-Browser-${RELEASE_VERSION}.apk"
      - name: Sauvegarder Release dans Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Agent-Browser-release-${{ github.run_number }}
          path: CHK-Agent-Browser-*.apk
          retention-days: 2
      - name: Publier la nouvelle Release GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: |
          gh release create "v${RELEASE_VERSION}" "CHK-Agent-Browser-${RELEASE_VERSION}.apk" \
            --title "CHK Agent Browser ${RELEASE_VERSION}" \
            --notes "APK signé. Mises à jour : Réglages > Vérifier les mises à jour."
