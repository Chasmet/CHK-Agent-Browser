name: CHK Agent Browser - APK Android et Releases
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/offline-studio-director, agent/persistent-autopilot-preview, agent/connection-resilience, agent/browser-stability-20261009, agent/mobile-workspace-20261009, agent/mobile-studio-20261009, agent/general-audit-20261010, feature/cut-studio-20261010, 'feature/cut-*', 'feature/files-*', 'feature/share-*', 'feature/browser-*', 'feature/session-*', 'feature/publication-*', 'feature/agent-desktop-*', 'feature/local3-*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  actions: read
concurrency:
  group: chk-agent-browser-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Télécharger les sources
        uses: actions/checkout@v4
      - name: Préparer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 36 (runner Ubuntu préinstallé)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.11.1
      - name: Vérifier les scripts navigateur et la reconnexion
        run: bash validation/check.sh
      - name: Compiler APK debug
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Afficher les erreurs Android si la vérification échoue
        if: failure()
        run: |
          if test -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; then
            grep -A 5 'Error:' app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          fi
      - name: Autoriser KVM pour les tests Android
        run: sudo chmod 666 /dev/kvm
      - name: Tester navigateur, Fichiers, Notes et véritable export vidéo sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /data/local/tmp/chk-autonomy-fixtures app/build/autonomy-fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les documents créés par Android avec des lecteurs indépendants
        run: |
          python -m pip install python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pypdf==6.10.0
          python validation/check_generated_documents.py app/build/autonomy-fixtures
      - name: Conserver les résultats des tests Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-android-tests-${{ github.run_number }}
          path: app/build/reports/androidTests/
          retention-days: 2
          if-no-files-found: ignore
      - name: Conserver seulement 1 jour dans Actions
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Agent-Browser-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          if-no-files-found: error
      - name: Charger signature persistante via GitHub OIDC et Render existant
        if: github.ref == 'refs/heads/main'
        run: python3 signing/prepare_ci.py
      - name: Compiler APK Release signé
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
          RELEASE_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Vérifier la signature Release
        if: github.ref == 'refs/heads/main'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Renommer l'APK Release
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: cp app/build/outputs/apk/release/app-release.apk "CHK-Agent-Browser-${RELEASE_VERSION}.apk"
      - name: Sauvegarder Release dans Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Agent-Browser-release-${{ github.run_number }}
          path: CHK-Agent-Browser-*.apk
          retention-days: 2
      - name: Publier la nouvelle Release GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 1.0.${{ github.run_number }}
        run: |
          RELAY_RUN=$(gh run list --workflow chk-home-mcp-windows.yml --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId // empty')
          ASSETS=("CHK-Agent-Browser-${RELEASE_VERSION}.apk")
          if test -n "$RELAY_RUN"; then
            RELAY_RESULT=$(gh run view "$RELAY_RUN" --json conclusion --jq .conclusion)
            test "$RELAY_RESULT" = success
            gh run download "$RELAY_RUN" -n CHK-Home-MCP-Windows -D windows-relay
            (cd windows-relay && zip ../CHK-Home-MCP-1.4.1-Windows.zip *)
            ASSETS+=(CHK-Home-MCP-1.4.1-Windows.zip)
          fi
          sha256sum "${ASSETS[@]}" > SHA256SUMS.txt
          gh release create "v${RELEASE_VERSION}" "CHK-Agent-Browser-${RELEASE_VERSION}.apk" \
            --title "CHK Agent Browser ${RELEASE_VERSION}" \
            --notes-file docs/RELEASE_NOTES.md
          gh release upload "v${RELEASE_VERSION}" SHA256SUMS.txt
          if test -f CHK-Home-MCP-1.4.1-Windows.zip; then
            gh release upload "v${RELEASE_VERSION}" CHK-Home-MCP-1.4.1-Windows.zip
          fi
