name: CHK Local AI — WSP safety tests
on:
  pull_request:
    paths:
      - 'research/weight_space_edit.py'
      - 'research/test_weight_space_edit.py'
      - 'app/src/main/java/com/chk/agentbrowser/LocalAiPlaybook.java'
      - 'app/src/main/java/com/chk/agentbrowser/LocalAiController.java'
      - 'app/src/androidTest/java/com/chk/agentbrowser/LocalAiPlaybookTest.java'
      - '.github/workflows/local-ai-research.yml'
  push:
    branches: [main]
    paths:
      - 'research/weight_space_edit.py'
      - 'research/test_weight_space_edit.py'
      - '.github/workflows/local-ai-research.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lightweight numerical dependencies
        run: python -m pip install numpy==2.2.6 safetensors==0.5.3
      - name: Syntax and isolated tensor tests (no model download)
        run: |
          python -m py_compile research/weight_space_edit.py
          python -m unittest discover -s research -p 'test_weight_space_edit.py' -v
