name: Studio multitrack and crop verification
on:
  push:
    branches: [feature/local3-studio-tor-20261029]
  pull_request:
    paths: ['app/**', 'validation/verify_studio_exports.py', '.github/workflows/studio-audio-crop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-audio-crop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x gradlew
      - name: Static checks and build
        run: |
          bash validation/check.sh
          ./gradlew --no-daemon assembleDebug lintDebug assembleDebugAndroidTest
      - name: KVM
        run: sudo chmod 666 /dev/kvm
      - name: Real Android decode and exports
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            adb shell mkdir -p /data/local/tmp/chk-studio-proof
            adb shell chmod 777 /data/local/tmp/chk-studio-proof
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.chk.agentbrowser.StudioAudioCropTest,com.chk.agentbrowser.StudioMultitrackIntegrationTest,com.chk.agentbrowser.StudioTouchIntegrationTest,com.chk.agentbrowser.Local3IndependenceTest
            adb pull /data/local/tmp/chk-studio-proof app/build/studio-proof
      - name: Independent FFmpeg verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-numpy
          python3 validation/verify_studio_exports.py app/build/studio-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-proof-${{ github.sha }}
          path: |
            app/build/studio-proof/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn
