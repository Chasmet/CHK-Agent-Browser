name: Validate Android Local 2 bridge
on:
  push:
    branches:
      - feat/local2-workspace-autonomy-20261021
      - feature/android-local2-bridge-20261021
      - fix/dual-mcp-settings-final-20261021
      - feature/local2-batched-android-20261021
      - feature/local2-full-android-actions-20261021
      - fix/local2-toggle-activation-20261021
      - fix/local2-verified-connection-20261021
      - fix/local2-shared-session-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate available Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Install Android 36 platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build and lint Android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Enable KVM for Local 2 integration checks
        run: sudo chmod 666 /dev/kvm
      - name: Test Local 2 without Render and verify shared Android browser
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.chk.agentbrowser.WorkspaceAutonomyIntegrationTest,com.chk.agentbrowser.Local2SessionIntegrationTest,com.chk.agentbrowser.Local2ProtocolTest,com.chk.agentbrowser.BrowserTabsTranslationIntegrationTest
            adb pull /data/local/tmp/chk-autonomy-fixtures app/build/autonomy-fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open Android generated documents with independent Office and PDF readers
        run: |
          python -m pip install python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pypdf==6.10.0
          python validation/check_generated_documents.py app/build/autonomy-fixtures
      - name: Upload debug build for internal testing only
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Android-Local2-DEBUG-NOT-UPDATE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

