name: Validate Android Local 2 bridge
on:
  push:
    branches:
      - feature/android-local2-bridge-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate available Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Build and lint Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --stacktrace
      - name: Upload debug build for internal testing only
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Android-Local2-DEBUG-NOT-UPDATE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
