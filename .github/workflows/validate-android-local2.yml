name: Validate Android Local 2 bridge
on:
  push:
    branches:
      - feature/android-local2-bridge-20261021
      - fix/dual-mcp-settings-final-20261021
      - feature/local2-batched-android-20261021
      - feature/local2-full-android-actions-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate available Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Install Android 36 platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build and lint Android
        run: ./gradlew --no-daemon assembleDebug lintDebug --stacktrace
      - name: Upload debug build for internal testing only
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Android-Local2-DEBUG-NOT-UPDATE
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error      - feature/local2-full-android-actions-20261021

