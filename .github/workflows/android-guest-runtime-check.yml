name: Validate embedded ARM64 Android image boot
on:
  push:
    branches: [validation/embedded-android-boot]
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 28
    steps:
      - name: Install QEMU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 adb tesseract-ocr git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu ninja-build pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev libpng-dev libfdt-dev python3-venv
      - uses: actions/cache@v4
        id: qemu
        with:
          path: /tmp/chk-qemu-test
          key: chk-arm-runtime-qemu-11.1.2-v1
      - name: Build QEMU 11.1.2 for a matching test runtime
        if: steps.qemu.outputs.cache-hit != 'true'
        run: |
          curl --fail --silent --show-error --location --retry 2 https://download.qemu.org/qemu-11.1.2.tar.xz | tar xJ
          mkdir -p /tmp/chk-qemu-test
          cd qemu-11.1.2
          ./configure --target-list=aarch64-softmmu --enable-tcg --enable-slirp --disable-docs --disable-gtk --disable-sdl --disable-vnc --prefix=/tmp/chk-qemu-test
          ninja -C build -j 4
          install build/qemu-system-aarch64 /tmp/chk-qemu-test/
          cp build/pc-bios/edk2-aarch64-code.fd /tmp/chk-qemu-test/
      - name: Start the same Android image and verify its boot
        run: |
          mkdir proof
          curl --fail --silent --show-error --location --retry 2 -o image.zip https://github.com/jqssun/android-lineage-qemu/releases/download/v2026.10.18/UTM-VM-lineage-23.2-20261019-jqssun-virtio_arm64only.zip
          echo '171c0d215899d68f070fd45aea05ddb25737cf4ff16a25468e7cafbc65f4d8c9  image.zip' | sha256sum --check
          unzip -j image.zip '*/Data/vda.qcow2' '*/Data/vdb.qcow2' '*/Data/efi_vars.fd'
          rm image.zip
          qemu-img info --output=json efi_vars.fd | tee proof/efi-format.json
          EFI_FORMAT=$(python3 -c 'import json; print(json.load(open("proof/efi-format.json"))["format"])')
          if [ "$EFI_FORMAT" = raw ]; then truncate -s 64M efi_vars.fd; fi
          FIRMWARE=/tmp/chk-qemu-test/edk2-aarch64-code.fd
          test -s "$FIRMWARE"
          /tmp/chk-qemu-test/qemu-system-aarch64 -L /usr/share/qemu -machine virt -cpu max,pauth-impdef=on -accel tcg,thread=multi,tb-size=128 \
            -m 4096 -smp 4 -display none -monitor none -serial file:proof/serial.log -qmp unix:qmp.sock,server=on,wait=off \
            -device virtio-gpu-pci -device qemu-xhci,id=usb -device usb-tablet,bus=usb.0 -device usb-kbd,bus=usb.0 \
            -device virtio-rng-pci -device virtio-serial -device virtio-net-pci,netdev=net0 \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:5655-:5555 \
            -drive if=pflash,unit=0,format=raw,readonly=on,file="$FIRMWARE" \
            -drive if=pflash,unit=1,format="$EFI_FORMAT",file=efi_vars.fd \
            -drive file=vda.qcow2,if=none,id=vda,format=qcow2 -device virtio-blk-pci,drive=vda,bootindex=0 \
            -drive file=vdb.qcow2,if=none,id=vdb,format=qcow2 -device virtio-blk-pci,drive=vdb,bootindex=1 \
            > proof/qemu.log 2>&1 &
          vm_pid=$!
          trap 'kill "$vm_pid" 2>/dev/null || true' EXIT
          adb start-server
          for attempt in $(seq 1 85); do
            kill -0 "$vm_pid" 2>/dev/null || { cat proof/qemu.log; exit 1; }
            if test -S qmp.sock; then
              python3 - <<'PY' || cat proof/qemu.log
          import json, socket
          with socket.socket(socket.AF_UNIX) as qmp:
              qmp.settimeout(5)
              qmp.connect('qmp.sock')
              reply = qmp.makefile('rb')
              assert 'QMP' in json.loads(reply.readline())
              for number, command in enumerate([{'execute':'qmp_capabilities'},{'execute':'screendump','arguments':{'filename':'proof/frame.png','format':'png'}}]):
                  command['id']=number
                  qmp.sendall(json.dumps(command).encode()+b'\n')
                  while True:
                      result = json.loads(reply.readline())
                      if result.get('id') == number:
                          print(json.dumps(result))
                          break
          PY
            fi
            timeout 4 adb connect 127.0.0.1:5655 || true
            progress=$(timeout 4 adb -s 127.0.0.1:5655 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            tesseract proof/frame.png stdout >proof/screen.txt 2>/dev/null || true
            cat proof/screen.txt
            if grep -Eiq 'sys.boot_completed|boot has completed' proof/serial.log; then echo 'Android reports boot complete'; exit 0; fi
            if [ "$progress" = 1 ] || grep -Eiq 'welcome to lineageos|start setup|finishing system update|tap to unlock|initial setup|getting your phone ready|lineageos setup|swipe up to unlock' proof/screen.txt; then
              echo "Android guest boot verified"
              exit 0
            fi
            sleep 10
          done
          echo 'Android guest boot was not confirmed'
          exit 1
      - name: Print boot errors
        if: failure()
        run: |
          cat proof/qemu.log || true
          tail -100 proof/serial.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-guest-boot-evidence
          path: proof/
