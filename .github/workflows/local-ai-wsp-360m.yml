name: SmolLM2 360M — WSP real-weight experimental gate

on:
  workflow_dispatch:
  push:
    branches: [feature/local-ai-wsp-smollm2-360m]
    paths:
      - 'research/wsp_smollm2_360m.py'
      - '.github/workflows/local-ai-wsp-360m.yml'

permissions:
  contents: read

jobs:
  edit-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only model tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'transformers==4.49.0' \
            'accelerate==1.3.0' 'huggingface_hub==0.29.3' \
            'safetensors==0.5.3' sentencepiece protobuf
      - name: Fetch and verify the original 360M BF16 safetensors weights
        run: python research/wsp_smollm2_360m.py prepare
      - name: Measure actual activations and score unmodified model
        run: python research/wsp_smollm2_360m.py probe
      - name: WSP direct bilingual evidence-aware edit of tied output weights
        run: |
          python research/wsp_smollm2_360m.py head_edit
      - name: Re-evaluate changed neural weights on unseen prompts
        run: python research/wsp_smollm2_360m.py evaluate
      - name: Verify improvement and no regressions (never deploy unverified)
        id: gate
        continue-on-error: true
        run: python research/wsp_smollm2_360m.py gate
      - name: Build offline GGUF only if true WSP improvement was proved
        if: steps.gate.outcome == 'success'
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp .ci-wsp-360m/llama.cpp
          git -C .ci-wsp-360m/llama.cpp checkout 620d2225cc436ab0b001e3200e590e3b286ef9ab
          python -m pip install gguf
          python .ci-wsp-360m/llama.cpp/convert_hf_to_gguf.py \
            .ci-wsp-360m/candidate --outfile .ci-wsp-360m/CHK-WSP-360M-F16.gguf --outtype f16
          cmake -S .ci-wsp-360m/llama.cpp -B .ci-wsp-360m/llama-build \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build .ci-wsp-360m/llama-build --target llama-quantize -j2
          .ci-wsp-360m/llama-build/bin/llama-quantize \
            .ci-wsp-360m/CHK-WSP-360M-F16.gguf \
            .ci-wsp-360m/CHK-WSP-360M-Q4_K_M.gguf Q4_K_M
          sha256sum .ci-wsp-360m/CHK-WSP-360M-Q4_K_M.gguf \
            > .ci-wsp-360m/GGUF-SHA256.txt
          test $(stat -c%s .ci-wsp-360m/CHK-WSP-360M-Q4_K_M.gguf) -lt 400000000
      - name: Archive comparative results and patch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsp-360m-evaluation
          path: |
            .ci-wsp-360m/source.json
            .ci-wsp-360m/probe.json
            .ci-wsp-360m/baseline.json
            .ci-wsp-360m/after.json
            .ci-wsp-360m/verdict.json
            .ci-wsp-360m/candidate/model.patch.json
          retention-days: 7
          if-no-files-found: warn
      - name: Archive tested GGUF candidate (NOT an Android production release)
        if: steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-WSP-360M-tested-GGUF
          path: |
            .ci-wsp-360m/CHK-WSP-360M-Q4_K_M.gguf
            .ci-wsp-360m/GGUF-SHA256.txt
          retention-days: 7
