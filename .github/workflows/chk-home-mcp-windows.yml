name: CHK Home MCP Windows (sans Render)
on:
  push:
    branches:
      - feature/pc-home-mcp-20261021
      - feature/android-local2-bridge-20261021
      - feature/local2-batched-android-20261021
      - fix/local2-existing-mcp-20261021
      - feature/local2-full-android-actions-20261021
      - fix/windows-local2-upgrade-existing-20261021
    paths:
      - 'pc/CHK-Home-MCP/**'
      - '.github/workflows/chk-home-mcp-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-mcp:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Recuperer les sources GitHub
        uses: actions/checkout@v4
      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer client MCP officiel pour test d'interoperabilite
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "mcp>=1.10,<2"
      - name: Tester les outils MCP et les controles d'acces
        shell: pwsh
        run: |
          python -m unittest discover -s pc/CHK-Home-MCP/tests -v
          python pc/CHK-Home-MCP/chk_home_mcp.py --once-test
          python -m py_compile pc/CHK-Home-MCP/chk_home_installer_gui.py
      - name: Compiler un vrai EXE Windows x64
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --console --name CHK-Home-MCP pc/CHK-Home-MCP/chk_home_mcp.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CHK-Home-Installation pc/CHK-Home-MCP/chk_home_installer_gui.py
      - name: Verifier l'EXE compile
        shell: pwsh
        run: |
          & .\dist\CHK-Home-MCP.exe --once-test
          if ($LASTEXITCODE -ne 0) { throw 'Executable Windows invalide' }
      - name: Preparer le ZIP d'installation
        shell: pwsh
        run: |
          New-Item -Path output\CHK-Home-MCP -ItemType Directory -Force | Out-Null
          Copy-Item dist\CHK-Home-MCP.exe output\CHK-Home-MCP\
          Copy-Item dist\CHK-Home-Installation.exe output\CHK-Home-MCP\
          Copy-Item pc\CHK-Home-MCP\README.md output\CHK-Home-MCP\
      - name: Valider les fichiers Windows du nouveau pack sans CMD
        shell: pwsh
        run: |
          $required = @("output/CHK-Home-MCP/CHK-Home-MCP.exe", "output/CHK-Home-MCP/CHK-Home-Installation.exe", "output/CHK-Home-MCP/README.md")
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Fichier absent : $f" }
          }
          $files = Get-ChildItem output/CHK-Home-MCP -File
          if ($files.Count -ne 3) { throw 'ZIP doit contenir exactement deux EXE et README' }
      - name: Conserver le serveur MCP et son installateur
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Home-MCP-Windows
          path: output/CHK-Home-MCP/*
          if-no-files-found: error
          retention-days: 14
